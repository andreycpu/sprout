name: Sprout
options:
  bundleIdPrefix: com.sprout
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES

targets:
  Sprout:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sprout.app
        PRODUCT_NAME: Sprout
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

configs:
  Debug: debug
  Release: release
